# mindevo-security-hardening.conf
#
# 在 server 块内 include，拦截敏感文件的外部 HTTP 访问，
# 防止 .git、README.md 等文件即使意外出现在 Web 根目录也不会被公开下载。
# （对应 2026-10-20 市委网信办通报的信息泄露高危漏洞整改要求）

# 所有点文件/点目录（.git、.env、.DS_Store 等），但放行
# /.well-known/（Let's Encrypt 证书续期需要）
location ~ /\.(?!well-known) {
    return 404;
}

# 开发文档、依赖清单、脚本、备份与压缩包等敏感文件类型
location ~* \.(?:md|markdown|lock|log|sql|bak|swp|sh|ps1|py|env|ini|conf|yml|yaml|tar|tgz|gz|zip)$ {
    return 404;
}

# 常见的项目配置/依赖清单文件
location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|Gemfile|Makefile|Dockerfile) {
    return 404;
}
